name: Construire APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer les dépendances
        run: npm ci

      - name: Construire l'application web
        run: npm run build

      - name: Installer Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Créer l'application Android
        run: |
          npx cap init "Jenkil" "com.jenkil.app" --web-dir=dist
          npx cap add android
          npx cap sync android

      - name: Construire l'APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Récupérer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Jenkil-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
